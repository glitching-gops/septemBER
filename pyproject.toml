[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ber"
version = "0.0.1"
description = "Business Entity Resolution hackathon pipeline"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "scikit-learn",
    "rapidfuzz",
    "pyyaml",
    "matplotlib",
    "tabulate",
    "anyascii",
    "sparse-dot-topn",
    "psutil",
]

[project.optional-dependencies]
dev = ["pytest", "pip-licenses"]
# B6 dense blocker (GPU); see LICENSES.md for the flagged CUDA runtime wheels
dense = ["torch", "transformers"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
