# FROZEN final configuration for the P2 reproduction run.
#
# Identical to configs/p2.yaml except that every writable path points into a fresh
# /scratch/user4/p2/final tree, so the reproduction cannot read any artefact produced
# during development. Inputs (data/raw/*.tsv) and the model weights are the only things
# shared, which is what "reproduce from the raw TSVs" means here.
#
# Do not edit this file after the freeze; a change invalidates the config hash recorded
# in submissions/*/SUMMARY.md and in runs/runs.csv.
extends: p2.yaml

paths:
  cache_dir: /scratch/user4/p2/final/cache
  features_dir: /scratch/user4/p2/final/features
  models_dir: /scratch/user4/p2/final/models
  output_dir: /scratch/user4/p2/final/output
  final_dir: /scratch/user4/p2/final
  # reports/runs stay in the repo so the reproduction appends to the same ledger

versions:
  # The shipped feature set. Stated explicitly so the frozen config fully determines the
  # run and does not depend on a --feature-version flag on the command line.
  feature_version: f2
