# Region canonicalisation (both directions): every variant -> one canonical code token.
# Hand-written from general domain knowledge (US state names/USPS codes, Indian
# state/UT names and common abbreviations). This is a static normalisation table, NOT
# a data lookup against any external service. Native-script state names are covered
# by their anyascii transliterations, taken from tokens observed in the provided data.
# Applied to every record regardless of country; blocking is partitioned by country
# so code collisions across countries (e.g. "tn") are harmless.
regions:
  al: [alabama]
  ak: [alaska]
  az: [arizona]
  ar: [arkansas]
  ca: [california, calif]
  co: [colorado]
  ct: [connecticut]
  de: [delaware]
  dc: [district of columbia, washington dc]
  fl: [florida]
